<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio — Ed Cezar</title>
    <!-- apply saved theme bg instantly before CSS loads to prevent flash -->
    <script>
      (function () {
        const bgs = ["#1a0500", "#00101a", "#021a05", "#07001a", "#1a0a00"];
        const i = parseInt(localStorage.getItem("theme") || "0", 10);
        document.documentElement.style.background = bgs[i] || bgs[0];
        document.documentElement.style.minHeight = "100vh";
      })();
    </script>
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/spotify.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- layout runs in head so menubar/clock exist before body renders -->
    <script src="js/layout.js" defer></script>
  </head>
  <body>
    <app-layout active="home"></app-layout>

    <div id="spotifyMount"></div>

    <section class="hero">
      <div class="profile-container">
        <img
          id="profileImage"
          class="profile-img"
          src="assets/profile.jpg"
          alt="profile"
        />
        <div class="info">
          <h1 id="name"></h1>
          <p id="position"></p>
          <p id="tagline"></p>
          <div class="highlights" id="highlights"></div>
          <div class="skills" id="skills"></div>
        </div>
      </div>
    </section>

    <script src="js/tracks.js"></script>
    <script src="js/spotify.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
